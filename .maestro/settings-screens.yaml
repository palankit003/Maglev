# Open every Settings sub-screen in list order, check the page's key control, screenshot each.
# Rows and groups: app/(tabs)/settings.tsx (App, General, Finding things, Downloads, Network and power).
# Each row is scrolled into view first; the list is long and keeps its scroll position or resets, either works going top to bottom.
# Key controls are the labelled rows or toggles of each page (cited per row).
appId: com.maglev
name: settings-screens
---
- runFlow: subflows/onboard-if-needed.yaml
- tapOn: "Settings"
# Settings tab label: constants/copy.ts tabsCopy.names.settings
- scrollUntilVisible:
    element: "About"
    direction: DOWN
    timeout: 30000
- tapOn: "About"
- assertVisible: "App version"
# app/settings/about.tsx:55
- takeScreenshot: settings-about
- back
- scrollUntilVisible:
    element: "Appearance"
    direction: DOWN
    timeout: 30000
- tapOn: "Appearance"
- assertVisible: "Font"
# app/settings/interface.tsx:85
- takeScreenshot: settings-appearance
- back
- scrollUntilVisible:
    element: "Assistant"
    direction: DOWN
    timeout: 30000
- tapOn: "Assistant"
- assertVisible: "Adds an Assistant tab.*"
# app/settings/assistant.tsx:23 (subtitle)
- takeScreenshot: settings-assistant
- back
- scrollUntilVisible:
    element: "Notifications"
    direction: DOWN
    timeout: 30000
- tapOn: "Notifications"
- assertVisible: "Finished-download alerts"
# app/settings/notifications.tsx:23
- takeScreenshot: settings-notifications
- back
- scrollUntilVisible:
    element: "Backup and restore"
    direction: DOWN
    timeout: 30000
- tapOn: "Backup and restore"
- assertVisible: "Export backup"
# constants/copy.ts backupCopy.export.title
- takeScreenshot: settings-backup
- back
- scrollUntilVisible:
    element: "Search sources"
    direction: DOWN
    timeout: 30000
- tapOn: "Search sources"
- assertVisible: "Show adult sources"
# app/settings/search-providers.tsx:216
- takeScreenshot: settings-search-sources
- back
- scrollUntilVisible:
    element: "Auto-download"
    direction: DOWN
    timeout: 30000
- tapOn: "Auto-download"
- assertVisible: "Download new items automatically"
# app/settings/feeds.tsx:106
- takeScreenshot: settings-auto-download
- back
- scrollUntilVisible:
    element: "Speed and sharing"
    direction: DOWN
    timeout: 30000
- tapOn: "Speed and sharing"
- assertVisible: "Download limit"
# components/settings/SpeedSection.tsx:24
- takeScreenshot: settings-speed-queue
- back
- scrollUntilVisible:
    element: "Storage"
    direction: DOWN
    timeout: 30000
- tapOn: "Storage"
- assertVisible: "Download folder"
# app/settings/storage.tsx:45
- takeScreenshot: settings-storage
- back
- scrollUntilVisible:
    element: "Scheduling"
    direction: DOWN
    timeout: 30000
- tapOn: "Scheduling"
- assertVisible: "Use a schedule"
# app/settings/scheduling.tsx:85
- takeScreenshot: settings-scheduling
- back
- scrollUntilVisible:
    element: "Watches"
    direction: DOWN
    timeout: 30000
- tapOn: "Watches"
- assertVisible: "Maglev checks for new copies.*"
# constants/copy.ts watchCopy.intro (app/settings/watch.tsx:44)
- takeScreenshot: settings-watches
- back
- scrollUntilVisible:
    element: "Network"
    direction: DOWN
    timeout: 30000
- tapOn: "Network"
- assertVisible: "Wi-Fi only"
# app/settings/network.tsx:48
- takeScreenshot: settings-network
- back
- scrollUntilVisible:
    element: "Power"
    direction: DOWN
    timeout: 30000
- tapOn: "Power"
- assertVisible: "Charging only"
# app/settings/power.tsx:24
- takeScreenshot: settings-power
- back
- scrollUntilVisible:
    element: "Browser"
    direction: DOWN
    timeout: 30000
- tapOn: "Browser"
- assertVisible: "Ad blocking"
# app/settings/browser.tsx:119
- takeScreenshot: settings-browser
- back
